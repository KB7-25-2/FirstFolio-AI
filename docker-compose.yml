services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: firstfolio-ai:local
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${APP_PORT:-8000}"
      - --reload